root = true
if_missing = "error"

# Private fork APKs inherit Nicholas's user-level age provider.
[profiles.local.secrets]
T3CODE_ANDROID_KEYSTORE_BASE64 = { provider = "age", value = "", if_missing = "error" }
T3CODE_ANDROID_KEYSTORE_PASSWORD = { provider = "age", value = "", if_missing = "error" }
T3CODE_ANDROID_KEY_ALIAS = { default = "t3code" }
T3CODE_FCM_SERVICE_ACCOUNT = { provider = "age", value = "", description = "Server-only Firebase service-account JSON for paired Android notifications" }
T3CODE_ANDROID_GOOGLE_SERVICES_FILE = { provider = "age", value = "", description = "Local path to preview Android Firebase configuration" }
